name: Build & Sign Aksara Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-sign:
    name: Build Assets & Sign Release Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Zip Package
        run: |
          git archive --format=zip -o release.zip HEAD \
            composer.json index.php LICENSE.txt nginx.conf \
            aksara public \
            modules/Home themes/index.html themes/backend themes/default writable install

      - name: Generate Manifest & Cryptographic Signature
        env:
          PRIVATE_KEY: ${{ secrets.AKSARA_PRIVATE_KEY }}
        run: |
          export VERSION="$(php -r 'echo json_decode(file_get_contents("composer.json"))->version;')"
          export PHP_REQUIREMENT="$(php -r 'echo json_decode(file_get_contents("composer.json"))->require->php ?? "";')"
          export CI_REQUIREMENT="$(php -r 'echo json_decode(file_get_contents("composer.json"))->require->{"codeigniter4/framework"} ?? "";')"
          export PACKAGE_SHA256="$(sha256sum release.zip | cut -d' ' -f1)"
          export PACKAGE_SIZE="$(stat -c%s release.zip)"

          php -r '
          $manifest = [
              "schema" => 1,
              "product" => "aksara",
              "channel" => "stable",
              "version" => getenv("VERSION"),
              "min_version" => null,
              "tag" => getenv("GITHUB_REF_NAME"),
              "commit" => getenv("GITHUB_SHA"),
              "created_at" => gmdate("c"),
              "package" => [
                  "name" => "release.zip",
                  "sha256" => getenv("PACKAGE_SHA256"),
                  "size" => (int) getenv("PACKAGE_SIZE")
              ],
              "compatibility" => [
                  "php" => getenv("PHP_REQUIREMENT"),
                  "codeigniter" => getenv("CI_REQUIREMENT")
              ],
              "apply" => [
                  "allowed_paths" => [
                      "aksara/",
                      "install/",
                      "modules/Home/",
                      "public/",
                      "themes/backend/",
                      "themes/default/",
                      "themes/index.html",
                      "writable/.htaccess",
                      "writable/cache/index.html",
                      "writable/debugbar/index.html",
                      "writable/logs/index.html",
                      "writable/session/index.html",
                      "writable/translations/",
                      "composer.json",
                      "index.php",
                      "LICENSE.txt",
                      "nginx.conf"
                  ],
                  "blocked_paths" => [
                      ".env",
                      "composer.lock",
                      "config.php",
                      "package-lock.json",
                      ".git/",
                      "node_modules/",
                      "vendor/"
                  ],
                  "run_migrations" => true,
                  "run_seeders" => true
              ]
          ];

          file_put_contents("manifest.json", json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . PHP_EOL);
          '

          echo "$PRIVATE_KEY" > private_key.pem
          openssl dgst -sha256 -sign private_key.pem -out manifest.sig.bin manifest.json
          base64 -w 0 manifest.sig.bin > manifest.sig
          rm -f private_key.pem manifest.sig.bin

      - name: Upload Signed Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release.zip
            manifest.json
            manifest.sig
